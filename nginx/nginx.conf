worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Upload file size limit (50MB for media/homework/exam assets)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Rate limiting zone (15 requests per second per IP with burst capacity)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Real IP resolution from controlled Docker host / Cloudflare ingress
    set_real_ip_from 172.20.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Map for WebSocket Upgrade connection
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Embedded Docker DNS Resolver for dynamic service discovery
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Hardened Access Log Format: Excludes query strings, tokens, and authorization credentials
    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time '
                         '"$http_user_agent"';

    # Default Access Log using sanitized format
    access_log /var/log/nginx/access.log sanitized;

    # Gateway Server Block
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _ localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Standard Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Health Check (Nginx Ingress)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ----------------------------------------------------------------------
        # Backend API Services Routing
        # ----------------------------------------------------------------------

        # Auth Service
        location /api/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth-service:4001;
        }

        # User Service (Users, Attendance, Notifications, Manager, Accounting)
        location /api/users {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/manager {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/accounting {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/attendance {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/notifications {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/teacher {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/accountant {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/subscriptions {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/student {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/receipts {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }
        location /api/account {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user-service:4002;
        }

        # AI Service
        location /api/ai {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ai-service:4003;
            proxy_read_timeout 120s;
        }

        # Video Streaming (Optimized for byte ranges and long-running media streams)
        location ~ ^/api/courses/lessons/[^/]+/stream {
            proxy_pass http://course-service:4004;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Course Service (Courses, Exams, Assessments, Homework, Questions, Uploads, Payments)
        location /api/courses {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /api/exams {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /api/assessments {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /api/homework {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /api/questions {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /api/upload {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://course-service:4004;
            client_max_body_size 50M;
        }
        location /api/payments {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://course-service:4004;
        }
        location /uploads {
            proxy_pass http://course-service:4004;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        # Analytics Service
        location /api/analytics {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://analytics-service:4005;
        }

        # Catch-all for unmapped /api/ routes: Fail-closed with 404 JSON (Prevents SPA HTML fallback)
        location /api/ {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"API route not found"}';
        }

        # WebSocket (Socket.IO) handling for Course Service
        location /socket.io {
            proxy_pass http://course-service:4004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Frontend Application (SPA Static Assets & Client-Side Routing)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }

        # Block Sensitive Hidden Files (git, env, svn, etc.)
        location ~ /\.(git|env|svn|ht|DS_Store) {
            deny all;
        }
    }

