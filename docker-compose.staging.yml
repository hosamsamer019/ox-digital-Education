name: ox-digital-staging

services:
  # ============================================================================
  # Staging Nginx Gateway (Isolated Ingress on Ports 8090 / 8444)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: ox-digital-staging-nginx
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    depends_on:
      - frontend
      - auth-service
      - user-service
      - course-service
      - ai-service
      - analytics-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Frontend Application (React + Vite SPA with Redesigned Homepage)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ox-digital-staging-frontend
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network
    # Internal only: Proxied via staging Nginx on port 8090

  # ============================================================================
  # Staging Auth Service
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: ox-digital-staging-auth-service
    environment:
      - NODE_ENV=staging
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set in .env.staging}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-${REFRESH_TOKEN_SECRET}}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM=${SENDGRID_FROM:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging User Service
  # ============================================================================
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: ox-digital-staging-user-service
    environment:
      - NODE_ENV=staging
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging AI Service
  # ============================================================================
  ai-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ai-service
    container_name: ox-digital-staging-ai-service
    environment:
      - NODE_ENV=staging
      - PORT=4003
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-mistralai/mistral-small-24b-instruct-2501}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-}
      - OPENROUTER_EMERGENCY_MODEL=${OPENROUTER_EMERGENCY_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:8090}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-OX-DIGITAL Staging}
      - OPENROUTER_TIMEOUT_MS=${OPENROUTER_TIMEOUT_MS:-30000}
      - OPENROUTER_MAX_RETRIES=${OPENROUTER_MAX_RETRIES:-0}
      - OPENROUTER_ENABLE_FALLBACKS=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Course Service
  # ============================================================================
  course-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: course-service
    container_name: ox-digital-staging-course-service
    environment:
      - NODE_ENV=staging
      - PORT=4004
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - PAYMOB_API_KEY=${PAYMOB_API_KEY:-}
      - FAWRY_MERCHANT_CODE=${FAWRY_MERCHANT_CODE:-}
      - FAWRY_SECURITY_KEY=${FAWRY_SECURITY_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ox-digital-staging-uploads:/app/uploads
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Analytics Service
  # ============================================================================
  analytics-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: analytics-service
    container_name: ox-digital-staging-analytics-service
    environment:
      - NODE_ENV=staging
      - PORT=4005
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Video Worker (Isolated Local Transcoding)
  # ============================================================================
  video-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: video-worker
    container_name: ox-digital-staging-video-worker
    environment:
      - NODE_ENV=staging
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-ox-digital-videos-staging-disabled}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ox_digital_staging_avatars_data:/app/storage/avatars
    restart: always
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Database Migration Runner (One-Shot Profile Tool)
  # ============================================================================
  prisma-migrate:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: ox-digital-staging-prisma-migrate
    environment:
      - NODE_ENV=staging
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=/app/packages/database/prisma/schema.prisma"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./packages/database:/app/packages/database:ro
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging PostgreSQL (STRICTLY ISOLATED Named Volume & Catalog)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ox-digital-staging-postgres
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ox_staging_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-ox_digital_staging}
    # No host port publication — reachable strictly via ox-digital-staging-network
    volumes:
      - ox-digital-staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ox_staging_admin} -d $${POSTGRES_DB:-ox_digital_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ox-digital-staging-network

  # ============================================================================
  # Staging Redis (STRICTLY ISOLATED Named Volume)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ox-digital-staging-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ox-digital-staging-network
    volumes:
      - ox-digital-staging-redis-data:/data
    # No host port publication — reachable strictly via ox-digital-staging-network

networks:
  ox-digital-staging-network:
    name: ox-digital-staging-network
    driver: bridge

volumes:
  ox-digital-staging-postgres-data:
    name: ox-digital-staging-postgres-data
  ox-digital-staging-redis-data:
    name: ox-digital-staging-redis-data
  ox-digital-staging-uploads:
    name: ox-digital-staging-uploads
  ox_digital_staging_avatars_data:
    name: ox_digital_staging_avatars_data
